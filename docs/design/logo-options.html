<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Sightline — варіанти логотипа</title>
<style>
  :root { --paper:#EDE8DD; --ink:#17181A; --ink3:#78746B; --asphalt:#2B2E31; --ink-d:#E9E7E1; --acc:#C65A32; --acc-d:#E07A4F; }
  * { box-sizing: border-box; }
  body { margin:0; padding:40px 48px; background:var(--paper); color:var(--ink); font-family:"Segoe UI Variable Text","Segoe UI",sans-serif; }
  h1 { font:600 28px "Bahnschrift"; margin:0 0 6px; }
  p.lead { margin:0 0 32px; color:var(--ink3); font-size:14px; }
  .grid { display:grid; grid-template-columns:repeat(3, 1fr); gap:28px 32px; }
  .opt { background:#F3EFE6; border-radius:14px; padding:20px 22px 18px; }
  .row { display:flex; align-items:flex-end; gap:14px; }
  .tile { width:96px; height:96px; border-radius:22px; display:flex; align-items:center; justify-content:center; }
  .tile.l { background:var(--paper); box-shadow: inset 0 0 0 1px #D9D2C3; }
  .tile.d { background:var(--asphalt); }
  .tile.a { background:var(--acc); }
  .small { display:flex; flex-direction:column; gap:10px; margin-left:6px; }
  .small div { display:flex; gap:10px; align-items:center; }
  .chip { border-radius:7px; display:flex; align-items:center; justify-content:center; }
  .c32 { width:32px; height:32px; } .c16 { width:16px; height:16px; border-radius:4px; }
  .name { margin-top:14px; font:600 17px "Bahnschrift"; }
  .num { font:11px "Cascadia Mono",monospace; color:var(--ink3); margin-right:8px; }
  .desc { font-size:13px; color:#4B4A45; margin-top:4px; line-height:1.4; }
  svg { display:block; }
</style>
</head>
<body>
<h1>Sightline — варіанти логотипа</h1>
<p class="lead">Кожен варіант: світла плитка, темна плитка, акцентна плитка (трей / іконка застосунку) і як він читається в 32 та 16 px.</p>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <!-- 1: horizon line with a gap and a centre dot -->
    <symbol id="m1" viewBox="0 0 48 48"><rect x="6" y="22.5" width="12" height="3" rx="1.5" fill="var(--ink-c)"/><rect x="30" y="22.5" width="12" height="3" rx="1.5" fill="var(--ink-c)"/><circle cx="24" cy="24" r="3.2" fill="var(--acc-c)"/></symbol>
    <!-- 2: ring + dot -->
    <symbol id="m2" viewBox="0 0 48 48"><circle cx="24" cy="24" r="14" fill="none" stroke="var(--ink-c)" stroke-width="3"/><circle cx="24" cy="24" r="3.4" fill="var(--acc-c)"/></symbol>
    <!-- 3: four ticks + dot -->
    <symbol id="m3" viewBox="0 0 48 48"><g fill="var(--ink-c)"><rect x="22.5" y="7" width="3" height="10" rx="1.5"/><rect x="22.5" y="31" width="3" height="10" rx="1.5"/><rect x="7" y="22.5" width="10" height="3" rx="1.5"/><rect x="31" y="22.5" width="10" height="3" rx="1.5"/></g><circle cx="24" cy="24" r="2.8" fill="var(--acc-c)"/></symbol>
    <!-- 4: open brackets around a dot -->
    <symbol id="m4" viewBox="0 0 48 48"><path d="M17 10 A15 15 0 0 0 17 38" fill="none" stroke="var(--ink-c)" stroke-width="3" stroke-linecap="round"/><path d="M31 10 A15 15 0 0 1 31 38" fill="none" stroke="var(--ink-c)" stroke-width="3" stroke-linecap="round"/><circle cx="24" cy="24" r="3.4" fill="var(--acc-c)"/></symbol>
    <!-- 5: lens: circle with the sight line crossing it -->
    <symbol id="m5" viewBox="0 0 48 48"><circle cx="24" cy="24" r="12" fill="none" stroke="var(--ink-c)" stroke-width="3"/><rect x="4" y="22.5" width="10" height="3" rx="1.5" fill="var(--ink-c)"/><rect x="34" y="22.5" width="10" height="3" rx="1.5" fill="var(--ink-c)"/><circle cx="24" cy="24" r="3" fill="var(--acc-c)"/></symbol>
    <!-- 6: monogram S built from two quarter arcs with the dot as its centre -->
    <symbol id="m6" viewBox="0 0 48 48"><path d="M33 13 H22 a7 7 0 0 0 0 14" fill="none" stroke="var(--ink-c)" stroke-width="3.2" stroke-linecap="round"/><path d="M15 35 H26 a7 7 0 0 0 0 -14" fill="none" stroke="var(--ink-c)" stroke-width="3.2" stroke-linecap="round"/><circle cx="24" cy="24" r="3" fill="var(--acc-c)"/></symbol>
  </defs>
</svg>

<div class="grid" id="grid"></div>

<script>
  const opts = [
    ["Лінія прицілу", "Буквально «sightline»: горизонт із розривом і точкою в центрі. Найтихіший і найупізнаваніший у 16 px."],
    ["Кільце й точка", "Класичний коліматорний приціл. Простий, дружній, добре читається на панелі завдань."],
    ["Чотири риски", "Мінімальний хрест без рамки — пряма відсилка до того, що робить програма."],
    ["Дужки", "Дві дуги ( • ) — фокус на цілі. М'якший, менш «військовий» характер."],
    ["Лінза", "Коло з лінією прицілу, що його перетинає: оптика + назва в одному знаку."],
    ["Монограма S", "Літера S з двох дуг із точкою в центрі — фірмовий знак, а не піктограма."],
  ];
  const g = document.getElementById("grid");
  opts.forEach(([name, desc], i) => {
    const id = "m" + (i + 1);
    const use = (ink, acc, size) => `<svg width="${size}" height="${size}" style="--ink-c:${ink};--acc-c:${acc}"><use href="#${id}"/></svg>`;
    g.insertAdjacentHTML("beforeend", `
      <div class="opt">
        <div class="row">
          <div class="tile l">${use("#17181A", "#C65A32", 64)}</div>
          <div class="tile d">${use("#E9E7E1", "#E07A4F", 64)}</div>
          <div class="tile a">${use("#FBF8F1", "#17181A", 64)}</div>
          <div class="small">
            <div><div class="chip c32" style="background:#2B2E31">${use("#E9E7E1", "#E07A4F", 26)}</div><div class="chip c32" style="background:#C65A32">${use("#FBF8F1", "#17181A", 26)}</div></div>
            <div><div class="chip c16" style="background:#2B2E31">${use("#E9E7E1", "#E07A4F", 14)}</div><div class="chip c16" style="background:#C65A32">${use("#FBF8F1", "#17181A", 14)}</div></div>
          </div>
        </div>
        <div class="name"><span class="num">0${i + 1}</span>${name}</div>
        <div class="desc">${desc}</div>
      </div>`);
  });
</script>
</body>
</html>
